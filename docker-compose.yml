services:
  db:
    image: postgres:16-alpine
    container_name: solutech-db-container
    restart: unless-stopped
    environment:
      POSTGRES_USER: solutech
      POSTGRES_PASSWORD: solutech
      POSTGRES_DB: db_solutech
    ports:
      - 5432:5432
    volumes:
      - solutech-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U solutech -d db_solutech']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - solutech-network

  redis:
    image: redis:7-alpine
    container_name: solutech-redis-container
    restart: unless-stopped
    ports:
      - 6379:6379
    volumes:
      - solutech-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - solutech-network

  solutech-ecommerce-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: solutech-ecommerce-api-container
    restart: unless-stopped
    ports:
      - 127.0.0.1:${APP_PORT}:${APP_PORT}
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: ${APP_PORT}
      TZ: Asia/Jakarta
    networks:
      - solutech-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

networks:
  solutech-network:
    driver: bridge

volumes:
  solutech-db-data:
  solutech-redis-data:
